<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamming(7,4) Block</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: safe center;
      background: #0c0e14;
      font-family: 'Inter', sans-serif;
      color: #e2e8f0;
      padding: 2.5rem 1rem;
    }

    h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.4rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #6ee7b7, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2.5rem;
    }

    .row {
      display: flex;
      gap: 12px
    }

    .bit-btn {
      width: 64px;
      height: 64px;
      border: none;
      border-radius: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.6rem;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      transition: transform .15s, box-shadow .25s, background .25s, color .25s;
      outline: none;
    }

    .bit-btn:active {
      transform: scale(.9)
    }

    .bit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .45)
    }

    /* data bit colours */
    .bit-btn.data[data-v="0"] {
      background: #1e2130;
      color: #64748b;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .3)
    }

    .bit-btn.data[data-v="1"] {
      background: linear-gradient(135deg, #6ee7b7, #34d399);
      color: #064e3b;
      box-shadow: 0 4px 18px rgba(110, 231, 183, .25)
    }

    /* parity bit colours */
    .bit-btn.parity[data-v="0"] {
      background: #1a1a2e;
      color: #7c3aed;
      border: 2px solid #7c3aed;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .3)
    }

    .bit-btn.parity[data-v="1"] {
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      color: #faf5ff;
      border: 2px solid transparent;
      box-shadow: 0 4px 18px rgba(124, 58, 237, .35)
    }

    /* index labels */
    .labels {
      display: flex;
      gap: 12px;
      margin-top: 8px
    }

    .lbl {
      width: 64px;
      text-align: center;
      font-size: .7rem;
      font-family: 'JetBrains Mono', monospace;
      color: #475569;
      letter-spacing: .04em;
    }

    .lbl.parity-lbl {
      color: #7c3aed
    }

    /* checks section */
    .checks {
      margin-top: 2.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: .85rem;
    }

    .check-name {
      width: 180px;
      text-align: right;
      color: #94a3b8;
    }

    .check-val {
      padding: 4px 16px;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      font-size: .8rem;
      min-width: 64px;
      text-align: center;
      transition: background .3s, color .3s;
    }

    .check-val.even {
      background: rgba(110, 231, 183, .12);
      color: #6ee7b7
    }

    .check-val.odd {
      background: rgba(248, 113, 113, .12);
      color: #f87171
    }

    /* syndrome */
    .syndrome {
      margin-top: 1.6rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      letter-spacing: .06em;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .syndrome-label {
      color: #94a3b8
    }

    .syndrome-bits {
      padding: 6px 18px;
      border-radius: 10px;
      background: #1e2130;
      color: #e2e8f0;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .syndrome-dec {
      padding: 6px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      transition: background .3s, color .3s;
    }

    .syndrome-dec.ok {
      background: rgba(110, 231, 183, .12);
      color: #6ee7b7
    }

    .syndrome-dec.err {
      background: rgba(248, 113, 113, .12);
      color: #f87171
    }

    .correct-btn {
      margin-top: 1.4rem;
      padding: 10px 22px;
      border: none;
      border-radius: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .04em;
      cursor: pointer;
      background: #1e2130;
      color: #e2e8f0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
      transition: transform .15s, background .25s, color .25s;
    }

    .correct-btn:hover {
      transform: translateY(-2px);
      background: #262a3d
    }

    .correct-btn:active {
      transform: scale(.96)
    }

    /* flip animation */
    @keyframes flip {
      0% {
        transform: rotateX(0)
      }

      50% {
        transform: rotateX(90deg)
      }

      100% {
        transform: rotateX(0)
      }
    }

    .flipping {
      animation: flip .25s ease
    }

    .text-encode {
      margin-top: 2.8rem;
      width: min(100%, 960px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .note-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: .85rem;
      color: #94a3b8;
      letter-spacing: .04em;
    }

    .seal-controls {
      width: min(100%, 36rem);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    #note {
      flex: 1 1 14rem;
      min-width: 0;
      height: 42px;
      padding: 0 14px;
      border: none;
      border-radius: 12px;
      background: #1e2130;
      color: #e2e8f0;
      font-family: 'JetBrains Mono', monospace;
      font-size: .95rem;
      outline: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
    }

    #note:focus-visible {
      box-shadow: 0 0 0 2px #7c3aed;
    }

    #seal {
      margin-top: 0;
    }

    .sealed-row {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px 18px;
    }

    .sealed-block {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sealed-bit {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: .8rem;
      font-weight: 700;
      pointer-events: none;
      user-select: none;
    }

    .sealed-bit.data[data-v="0"] {
      background: #1e2130;
      color: #64748b;
    }

    .sealed-bit.data[data-v="1"] {
      background: linear-gradient(135deg, #6ee7b7, #34d399);
      color: #064e3b;
    }

    .sealed-bit.parity[data-v="0"] {
      background: #1a1a2e;
      color: #7c3aed;
      border: 2px solid #7c3aed;
    }

    .sealed-bit.parity[data-v="1"] {
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      color: #faf5ff;
    }

    .sealed-bit.overall {
      width: 18px;
      height: 18px;
      margin-right: 4px;
      border-radius: 5px;
      font-size: .65rem;
    }

    .scratch-controls {
      width: min(100%, 40rem);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px 14px;
    }

    #flip {
      width: 180px;
      accent-color: #a78bfa;
    }

    #scratch {
      margin-top: 0;
    }

    .decode-lines {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: .95rem;
    }

    .decode-line {
      color: #e2e8f0;
    }
  </style>
</head>

<body>

  <h1>Hamming(7,4) Block</h1>

  <div class="row" id="row"></div>
  <div class="labels" id="labels"></div>
  <div class="checks" id="checks"></div>
  <div class="syndrome" id="syndrome"></div>
  <button type="button" id="correct" class="correct-btn">Correct</button>

  <section class="text-encode">
    <div class="seal-controls">
      <label class="note-label" for="note">Note</label>
      <input id="note" type="text" autocomplete="off" spellcheck="false">
      <button type="button" id="seal" class="correct-btn">Seal</button>
    </div>
    <div id="sealed" class="sealed-row"></div>
    <div class="scratch-controls">
      <label class="note-label" for="flip">flip chance</label>
      <input id="flip" type="range" min="0" max="0.3" step="0.01" value="0">
      <span id="flip-value" class="note-label">0</span>
      <button type="button" id="scratch" class="correct-btn">Scratch</button>
    </div>
    <div id="scratched" class="sealed-row"></div>
    <div class="decode-lines">
      <p class="decode-line" id="raw-line">raw: <span id="raw"></span></p>
      <p class="decode-line" id="repaired-line">repaired: <span id="repaired"></span></p>
    </div>
  </section>

  <script>
    (function () {
      // positions 1..7, stored in array index 0..6
      var PARITY_POS = { 1: true, 2: true, 4: true };

      // initial data bits: pos3=1, pos5=0, pos6=1, pos7=1
      var bits = [0, 0, 0, 0, 0, 0, 0];
      bits[2] = 1;  // pos 3
      bits[4] = 0;  // pos 5
      bits[5] = 1;  // pos 6
      bits[6] = 1;  // pos 7

      // fill parity on load
      bits[0] = bits[2] ^ bits[4] ^ bits[6];  // p1: pos 1,3,5,7
      bits[1] = bits[2] ^ bits[5] ^ bits[6];  // p2: pos 2,3,6,7
      bits[3] = bits[4] ^ bits[5] ^ bits[6];  // p4: pos 4,5,6,7

      var row = document.getElementById('row');
      var labels = document.getElementById('labels');

      // check groups (array indices)
      var checks = [
        { name: 'check₁ (1,3,5,7)', idx: [0, 2, 4, 6] },
        { name: 'check₂ (2,3,6,7)', idx: [1, 2, 5, 6] },
        { name: 'check₄ (4,5,6,7)', idx: [3, 4, 5, 6] }
      ];

      // build buttons
      for (var i = 0; i < 7; i++) {
        (function (i) {
          var pos = i + 1;
          var isParity = PARITY_POS[pos] === true;

          var btn = document.createElement('button');
          btn.className = 'bit-btn ' + (isParity ? 'parity' : 'data');
          btn.setAttribute('data-v', bits[i]);
          btn.textContent = bits[i];
          btn.id = 'bit-' + i;

          btn.addEventListener('click', function () {
            bits[i] = bits[i] ^ 1;
            updateBtn(i);
            updateChecks();

            btn.classList.remove('flipping');
            void btn.offsetWidth;
            btn.classList.add('flipping');
          });

          row.appendChild(btn);

          var lbl = document.createElement('div');
          lbl.className = 'lbl' + (isParity ? ' parity-lbl' : '');
          lbl.textContent = isParity ? 'p' + pos : 'd' + pos;
          labels.appendChild(lbl);
        })(i);
      }

      // build check display
      var checksDiv = document.getElementById('checks');
      var checkEls = [];
      checks.forEach(function (c) {
        var r = document.createElement('div');
        r.className = 'check-row';

        var nm = document.createElement('span');
        nm.className = 'check-name';
        nm.textContent = c.name;

        var val = document.createElement('span');
        val.className = 'check-val';

        r.appendChild(nm);
        r.appendChild(val);
        checksDiv.appendChild(r);
        checkEls.push(val);
      });

      // syndrome display
      var syndrome = 0;
      var synDiv = document.getElementById('syndrome');
      synDiv.innerHTML =
        '<span class="syndrome-label">syndrome</span>' +
        '<span class="syndrome-bits" id="syn-bits"></span>' +
        '<span class="syndrome-dec" id="syn-dec"></span>';

      document.getElementById('correct').addEventListener('click', function () {
        if (syndrome < 1 || syndrome > 7) return;
        var i = syndrome - 1;
        bits[i] = bits[i] ^ 1;
        updateBtn(i);
        updateChecks();

        var btn = document.getElementById('bit-' + i);
        btn.classList.remove('flipping');
        void btn.offsetWidth;
        btn.classList.add('flipping');
      });

      function updateBtn(i) {
        var btn = document.getElementById('bit-' + i);
        btn.setAttribute('data-v', bits[i]);
        btn.textContent = bits[i];
      }

      function updateChecks() {
        var synBits = [0, 0, 0]; // check4, check2, check1

        checks.forEach(function (c, ci) {
          var sum = 0;
          c.idx.forEach(function (j) { sum += bits[j]; });
          var even = sum % 2 === 0;
          checkEls[ci].textContent = even ? 'even' : 'odd';
          checkEls[ci].className = 'check-val ' + (even ? 'even' : 'odd');

          // syndrome bit: 1 if odd (fail)
          // checks order: check1=ci0, check2=ci1, check4=ci2
          // syndrome bits order: check4 check2 check1
          if (ci === 0) synBits[2] = even ? 0 : 1; // check1
          if (ci === 1) synBits[1] = even ? 0 : 1; // check2
          if (ci === 2) synBits[0] = even ? 0 : 1; // check4
        });

        var synStr = '' + synBits[0] + synBits[1] + synBits[2];
        var synDec = synBits[0] * 4 + synBits[1] * 2 + synBits[2] * 1;
        syndrome = synDec;

        document.getElementById('syn-bits').textContent = synStr;
        var decEl = document.getElementById('syn-dec');
        decEl.textContent = '= ' + synDec;
        decEl.className = 'syndrome-dec ' + (synDec === 0 ? 'ok' : 'err');
      }

      updateChecks();
    })();

    (function () {
      var HAMMING_PARITY = { 1: true, 2: true, 4: true };
      var note = document.getElementById('note');
      var sealed = document.getElementById('sealed');
      var scratched = document.getElementById('scratched');
      var flip = document.getElementById('flip');
      var flipValue = document.getElementById('flip-value');

      function blockFromNibble(nibble) {
        var d3 = (nibble >> 3) & 1;
        var d5 = (nibble >> 2) & 1;
        var d6 = (nibble >> 1) & 1;
        var d7 = nibble & 1;
        var p1 = d3 ^ d5 ^ d7;
        var p2 = d3 ^ d6 ^ d7;
        var p4 = d5 ^ d6 ^ d7;
        var hamming = [p1, p2, d3, p4, d5, d6, d7];
        var p0 = 0;
        hamming.forEach(function (bit) { p0 ^= bit; });
        return [p0].concat(hamming);
      }

      function renderBlocks(container, blocks) {
        container.replaceChildren();
        blocks.forEach(function (bits) {
          var block = document.createElement('div');
          block.className = 'sealed-block';
          bits.forEach(function (bit, i) {
            var cell = document.createElement('div');
            var kind = i === 0 ? 'overall parity' : (HAMMING_PARITY[i] ? 'parity' : 'data');
            cell.className = 'sealed-bit ' + kind;
            cell.setAttribute('data-v', String(bit));
            cell.textContent = String(bit);
            block.appendChild(cell);
          });
          container.appendChild(block);
        });
      }

      function readBlocks(container) {
        return Array.prototype.map.call(container.children, function (block) {
          return Array.prototype.map.call(block.children, function (cell) {
            return cell.textContent === '1' ? 1 : 0;
          });
        });
      }

      function nibbleFrom(bits) {
        return (bits[3] << 3) | (bits[5] << 2) | (bits[6] << 1) | bits[7];
      }

      function syndrome(bits) {
        var hamming = bits.slice(1);
        var check1 = hamming[0] ^ hamming[2] ^ hamming[4] ^ hamming[6];
        var check2 = hamming[1] ^ hamming[2] ^ hamming[5] ^ hamming[6];
        var check4 = hamming[3] ^ hamming[4] ^ hamming[5] ^ hamming[6];
        return (check4 << 2) | (check2 << 1) | check1;
      }

      function overallOdd(bits) {
        var sum = 0;
        bits.forEach(function (bit) { sum ^= bit; });
        return sum === 1;
      }

      function repairBlock(bits) {
        var next = bits.slice();
        var syn = syndrome(next);
        var odd = overallOdd(next);
        if (syn === 0 && !odd) return { bits: next, ok: true };
        if (syn >= 1 && syn <= 7 && odd) {
          next[syn] ^= 1;
          return { bits: next, ok: true };
        }
        if (syn === 0 && odd) {
          next[0] ^= 1;
          return { bits: next, ok: true };
        }
        return { bits: bits.slice(), ok: false };
      }

      function charFrom(byte) {
        if (byte < 32 || byte === 127) return '?';
        return String.fromCharCode(byte);
      }

      function decodeRaw(blocks) {
        var text = '';
        for (var i = 0; i < blocks.length; i += 2) {
          if (i + 1 >= blocks.length || blocks[i].length !== 8 || blocks[i + 1].length !== 8) {
            text += '?';
            break;
          }
          var byte = (nibbleFrom(blocks[i]) << 4) | nibbleFrom(blocks[i + 1]);
          text += charFrom(byte);
        }
        return text;
      }

      function decodeRepaired(blocks) {
        var text = '';
        for (var i = 0; i < blocks.length; i += 2) {
          if (i + 1 >= blocks.length || blocks[i].length !== 8 || blocks[i + 1].length !== 8) {
            text += '?';
            break;
          }
          var a = repairBlock(blocks[i]);
          var b = repairBlock(blocks[i + 1]);
          if (!a.ok || !b.ok) {
            text += '?';
            continue;
          }
          var byte = (nibbleFrom(a.bits) << 4) | nibbleFrom(b.bits);
          text += charFrom(byte);
        }
        return text;
      }

      document.getElementById('seal').addEventListener('click', function () {
        var text = note.value.slice(0, 8);
        var blocks = [];
        for (var c = 0; c < text.length; c++) {
          var byte = text.charCodeAt(c) & 255;
          blocks.push(blockFromNibble((byte >> 4) & 15));
          blocks.push(blockFromNibble(byte & 15));
        }
        renderBlocks(sealed, blocks);
      });

      flip.addEventListener('input', function () {
        flipValue.textContent = flip.value;
      });

      document.getElementById('scratch').addEventListener('click', function () {
        var chance = Number(flip.value);
        var copy = readBlocks(sealed).map(function (bits) {
          return bits.map(function (bit) {
            return Math.random() < chance ? bit ^ 1 : bit;
          });
        });
        renderBlocks(scratched, copy);
        document.getElementById('raw').textContent = decodeRaw(copy);
        document.getElementById('repaired').textContent = decodeRepaired(copy);
      });
    })();
  </script>
</body>

</html>
