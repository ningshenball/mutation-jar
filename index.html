<!DOCTYPE html>
<!-- Page markup: the ? button, the help panel, and the three stacks. -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamming(7,4) Block</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <button type="button" id="help" class="help-btn" aria-label="How this works">?</button>
  <dialog id="how-dialog" closedby="any" aria-labelledby="how-title">
    <div class="how-head">
      <h2 id="how-title">How this works</h2>
      <form method="dialog">
        <button type="submit" id="how-close" class="correct-btn">Close</button>
      </form>
    </div>
    <div id="how-body"></div>
  </dialog>

  <h1>Hamming(7,4) Block</h1>

  <main class="stacks">
    <section class="stack" aria-labelledby="demo-title">
      <h2 class="stack-title" id="demo-title">Demo block</h2>
      <div class="row" id="row"></div>
      <div class="labels" id="labels"></div>
      <div class="checks" id="checks"></div>
      <div class="syndrome" id="syndrome"></div>
      <button type="button" id="correct" class="correct-btn">Correct</button>
    </section>

    <section class="stack" aria-labelledby="seal-title">
      <h2 class="stack-title" id="seal-title">Seal and scratch</h2>
      <div class="seal-controls">
        <label class="note-label" for="note">Note</label>
        <input id="note" type="text" autocomplete="off" spellcheck="false">
        <button type="button" id="seal" class="correct-btn">Seal</button>
      </div>
      <div id="sealed" class="sealed-row"></div>
      <div class="scratch-controls">
        <label class="note-label" for="flip">flip chance</label>
        <input id="flip" type="range" min="0" max="0.3" step="0.01" value="0">
        <span id="flip-value" class="note-label">0</span>
        <button type="button" id="scratch" class="correct-btn">Scratch</button>
      </div>
      <div id="scratched" class="sealed-row"></div>
      <div class="decode-lines">
        <p class="decode-line" id="raw-line">raw: <span id="raw"></span></p>
        <p class="decode-line" id="repaired-line">repaired: <span id="repaired"></span></p>
      </div>
    </section>

    <section class="stack" aria-labelledby="file-title">
      <h2 class="stack-title" id="file-title">The file</h2>
      <div class="file-controls">
        <button type="button" id="download" class="correct-btn">Download</button>
        <button type="button" id="open" class="correct-btn">Open</button>
        <button type="button" id="rot1" class="correct-btn">Rot 1</button>
        <button type="button" id="rot8" class="correct-btn">Rot 8</button>
        <input id="open-file" class="file-input" type="file" accept=".mjar">
      </div>
      <p class="decode-line" id="opened-line">opened: <span id="opened"></span></p>
    </section>
  </main>

  <script src="demo.js"></script>
  <script src="jar.js"></script>
  <script src="help.js"></script>
</body>

</html>
