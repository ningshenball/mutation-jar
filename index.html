<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamming(7,4) Block</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap');

  *{margin:0;padding:0;box-sizing:border-box}

  body{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#0c0e14;
    font-family:'Inter',sans-serif;
    color:#e2e8f0;
  }

  h1{
    font-family:'JetBrains Mono',monospace;
    font-size:1.4rem;letter-spacing:.08em;
    text-transform:uppercase;
    background:linear-gradient(135deg,#6ee7b7,#3b82f6);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    margin-bottom:2.5rem;
  }

  .row{display:flex;gap:12px}

  .bit-btn{
    width:64px;height:64px;border:none;border-radius:14px;
    font-family:'JetBrains Mono',monospace;font-size:1.6rem;font-weight:700;
    cursor:pointer;position:relative;
    transition:transform .15s,box-shadow .25s,background .25s,color .25s;
    outline:none;
  }

  .bit-btn:active{transform:scale(.9)}
  .bit-btn:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.45)}

  /* data bit colours */
  .bit-btn.data[data-v="0"]{background:#1e2130;color:#64748b;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .bit-btn.data[data-v="1"]{background:linear-gradient(135deg,#6ee7b7,#34d399);color:#064e3b;box-shadow:0 4px 18px rgba(110,231,183,.25)}

  /* parity bit colours */
  .bit-btn.parity[data-v="0"]{background:#1a1a2e;color:#7c3aed;border:2px solid #7c3aed;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .bit-btn.parity[data-v="1"]{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#faf5ff;border:2px solid transparent;box-shadow:0 4px 18px rgba(124,58,237,.35)}

  /* index labels */
  .labels{display:flex;gap:12px;margin-top:8px}
  .lbl{
    width:64px;text-align:center;font-size:.7rem;
    font-family:'JetBrains Mono',monospace;color:#475569;letter-spacing:.04em;
  }
  .lbl.parity-lbl{color:#7c3aed}

  /* checks section */
  .checks{
    margin-top:2.2rem;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }

  .check-row{
    display:flex;align-items:center;gap:10px;
    font-family:'JetBrains Mono',monospace;font-size:.85rem;
  }

  .check-name{
    width:180px;text-align:right;color:#94a3b8;
  }

  .check-val{
    padding:4px 16px;border-radius:999px;
    font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    font-size:.8rem;min-width:64px;text-align:center;
    transition:background .3s,color .3s;
  }
  .check-val.even{background:rgba(110,231,183,.12);color:#6ee7b7}
  .check-val.odd {background:rgba(248,113,113,.12);color:#f87171}

  /* syndrome */
  .syndrome{
    margin-top:1.6rem;
    font-family:'JetBrains Mono',monospace;
    font-size:1rem;letter-spacing:.06em;
    display:flex;align-items:center;gap:12px;
  }
  .syndrome-label{color:#94a3b8}
  .syndrome-bits{
    padding:6px 18px;border-radius:10px;
    background:#1e2130;color:#e2e8f0;font-weight:700;font-size:1.1rem;
  }
  .syndrome-dec{
    padding:6px 14px;border-radius:10px;font-weight:700;font-size:1.1rem;
    transition:background .3s,color .3s;
  }
  .syndrome-dec.ok{background:rgba(110,231,183,.12);color:#6ee7b7}
  .syndrome-dec.err{background:rgba(248,113,113,.12);color:#f87171}

  /* flip animation */
  @keyframes flip{
    0%{transform:rotateX(0)}
    50%{transform:rotateX(90deg)}
    100%{transform:rotateX(0)}
  }
  .flipping{animation:flip .25s ease}
</style>
</head>
<body>

<h1>Hamming(7,4) Block</h1>

<div class="row" id="row"></div>
<div class="labels" id="labels"></div>
<div class="checks" id="checks"></div>
<div class="syndrome" id="syndrome"></div>

<script>
(function(){
  // positions 1..7, stored in array index 0..6
  var PARITY_POS = {1:true, 2:true, 4:true};

  // initial data bits: pos3=1, pos5=0, pos6=1, pos7=1
  var bits = [0,0,0,0,0,0,0];
  bits[2] = 1;  // pos 3
  bits[4] = 0;  // pos 5
  bits[5] = 1;  // pos 6
  bits[6] = 1;  // pos 7

  // fill parity on load
  bits[0] = bits[2] ^ bits[4] ^ bits[6];  // p1: pos 1,3,5,7
  bits[1] = bits[2] ^ bits[5] ^ bits[6];  // p2: pos 2,3,6,7
  bits[3] = bits[4] ^ bits[5] ^ bits[6];  // p4: pos 4,5,6,7

  var row    = document.getElementById('row');
  var labels = document.getElementById('labels');

  // check groups (array indices)
  var checks = [
    {name:'check₁ (1,3,5,7)', idx:[0,2,4,6]},
    {name:'check₂ (2,3,6,7)', idx:[1,2,5,6]},
    {name:'check₄ (4,5,6,7)', idx:[3,4,5,6]}
  ];

  // build buttons
  for(var i = 0; i < 7; i++){
    (function(i){
      var pos = i + 1;
      var isParity = PARITY_POS[pos] === true;

      var btn = document.createElement('button');
      btn.className = 'bit-btn ' + (isParity ? 'parity' : 'data');
      btn.setAttribute('data-v', bits[i]);
      btn.textContent = bits[i];
      btn.id = 'bit-' + i;

      btn.addEventListener('click', function(){
        bits[i] = bits[i] ^ 1;
        updateBtn(i);
        updateChecks();

        btn.classList.remove('flipping');
        void btn.offsetWidth;
        btn.classList.add('flipping');
      });

      row.appendChild(btn);

      var lbl = document.createElement('div');
      lbl.className = 'lbl' + (isParity ? ' parity-lbl' : '');
      lbl.textContent = isParity ? 'p' + pos : 'd' + pos;
      labels.appendChild(lbl);
    })(i);
  }

  // build check display
  var checksDiv = document.getElementById('checks');
  var checkEls = [];
  checks.forEach(function(c){
    var r = document.createElement('div');
    r.className = 'check-row';

    var nm = document.createElement('span');
    nm.className = 'check-name';
    nm.textContent = c.name;

    var val = document.createElement('span');
    val.className = 'check-val';

    r.appendChild(nm);
    r.appendChild(val);
    checksDiv.appendChild(r);
    checkEls.push(val);
  });

  // syndrome display
  var synDiv = document.getElementById('syndrome');
  synDiv.innerHTML =
    '<span class="syndrome-label">syndrome</span>' +
    '<span class="syndrome-bits" id="syn-bits"></span>' +
    '<span class="syndrome-dec" id="syn-dec"></span>';

  function updateBtn(i){
    var btn = document.getElementById('bit-'+i);
    btn.setAttribute('data-v', bits[i]);
    btn.textContent = bits[i];
  }

  function updateChecks(){
    var synBits = [0,0,0]; // check4, check2, check1

    checks.forEach(function(c, ci){
      var sum = 0;
      c.idx.forEach(function(j){ sum += bits[j]; });
      var even = sum % 2 === 0;
      checkEls[ci].textContent = even ? 'even' : 'odd';
      checkEls[ci].className = 'check-val ' + (even ? 'even' : 'odd');

      // syndrome bit: 1 if odd (fail)
      // checks order: check1=ci0, check2=ci1, check4=ci2
      // syndrome bits order: check4 check2 check1
      if(ci === 0) synBits[2] = even ? 0 : 1; // check1
      if(ci === 1) synBits[1] = even ? 0 : 1; // check2
      if(ci === 2) synBits[0] = even ? 0 : 1; // check4
    });

    var synStr = '' + synBits[0] + synBits[1] + synBits[2];
    var synDec = synBits[0]*4 + synBits[1]*2 + synBits[2]*1;

    document.getElementById('syn-bits').textContent = synStr;
    var decEl = document.getElementById('syn-dec');
    decEl.textContent = '= ' + synDec;
    decEl.className = 'syndrome-dec ' + (synDec === 0 ? 'ok' : 'err');
  }

  updateChecks();
})();
</script>
</body>
</html>
